<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flip Sprint</title>
    <meta
      name="description"
      content="Flip Sprint — pousse ta chance jusqu'à la ligne d'arrivée. Jeu de cartes solo, local ou en ligne. Fonctionne hors-ligne, installable sur mobile et ordinateur."
    />
    <!-- Matches the top of the track gradient, so the browser's toolbar and any
         OS letterbox behind the notch blend into the board instead of reading
         as a black band. Keep in step with html's background-color and the
         manifest colours. -->
    <meta name="theme-color" content="#251056" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Translucent status bar: the app draws edge-to-edge behind it (the
         header keeps clear of the notch via safe-area insets), reclaiming the
         status-bar area to maximise the play surface. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flip Sprint" />
    <meta property="og:title" content="Flip Sprint" />
    <meta
      property="og:description"
      content="Pousse ta chance jusqu'à la ligne d'arrivée. Solo, local ou en ligne, jusqu'à 8 joueurs."
    />
    <meta property="og:image" content="og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
